<style>
  :root{
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --field:radial-gradient(130% 120% at 50% 12%,#FCEBDE 0%,#F6D9C9 45%,#E7B9A9 100%);
    --on-field:#4a3730; --on-soft:#8a6a5c; --glass:rgba(255,255,255,.28);
    --line:rgba(46,42,50,.12); --halo:rgba(240,160,120,.6);
  }
  /* the page's theme is the hour of the day, shifting on its own */
  body[data-tod="dawn"]{ --field:radial-gradient(130% 120% at 50% 12%,#FCEBDE 0%,#F6D9C9 45%,#E7B9A9 100%); --halo:rgba(240,160,120,.6); --on-field:#4a3730; --on-soft:#8a6a5c; }
  body[data-tod="day"]{  --field:radial-gradient(130% 130% at 50% 8%,#FBF6EF 0%,#EAF0F0 55%,#DCE7E6 100%); --halo:rgba(143,169,154,.55); --on-field:#33383a; --on-soft:#6f7a78; --line:rgba(46,42,50,.12); --glass:rgba(255,255,255,.32); }
  body[data-tod="dusk"]{ --field:radial-gradient(130% 120% at 50% 16%,#F6D9C0 0%,#E7A98f 48%,#B06e73 100%); --halo:rgba(245,155,120,.6); --on-field:#3a2a2c; --on-soft:#f2ddd3; }
  body[data-tod="night"]{--field:radial-gradient(130% 130% at 50% 14%,#2b2740 0%,#211d33 50%,#141220 100%); --halo:rgba(150,160,220,.5); --on-field:#efeaf4; --on-soft:#a9a4c6; --glass:rgba(255,255,255,.05); --line:rgba(255,255,255,.1); }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; min-height:100vh; font-family:var(--sans); color:var(--on-field);
    background:var(--field); background-attachment:fixed;
    transition:background 1.6s ease, color 1.6s ease;
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .stage{ width:min(540px,92vw); padding:44px 24px; text-align:center; }

  .aura{ width:158px; height:158px; margin:0 auto 34px; position:relative; }
  .aura .orb{ position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 38% 34%, rgba(255,255,255,.92), var(--halo) 46%, transparent 72%);
    box-shadow:0 0 60px 10px var(--halo); }
  .aura .ring{ position:absolute; inset:-16px; border-radius:50%; border:1px solid var(--halo); opacity:.35; }
  @media (prefers-reduced-motion:no-preference){
    .aura .orb{ animation:breathe 8s ease-in-out infinite; }
    .aura .ring{ animation:ripple 8s ease-in-out infinite; }
  }
  @keyframes breathe{ 0%,100%{transform:scale(.93); opacity:.9} 50%{transform:scale(1.07); opacity:1} }
  @keyframes ripple{ 0%,100%{transform:scale(.97); opacity:.22} 50%{transform:scale(1.14); opacity:.48} }

  .beat{ font-size:11.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--on-soft);
    font-weight:600; margin-bottom:16px; }
  .line{ font-family:var(--serif); font-size:clamp(24px,5.6vw,31px); line-height:1.34; font-weight:400;
    text-wrap:balance; margin:0 auto 30px; max-width:24ch; }

  .one{ display:inline-block; background:var(--glass); border:1px solid var(--line); border-radius:20px;
    padding:20px 24px; backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px); max-width:32ch; }
  .one .k{ font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--on-soft);
    font-weight:700; display:block; margin-bottom:9px; }
  .one .act{ font-family:var(--serif); font-size:19.5px; line-height:1.42; }

  /* the undercurrent — rotates on its own, nothing to press */
  .under{ min-height:2.6em; margin:30px auto 0; max-width:28ch; }
  .under p{ font-family:var(--serif); font-style:italic; font-size:16.5px; line-height:1.5;
    color:var(--on-soft); margin:0; text-wrap:balance; transition:opacity 1.1s ease; }

  .clock{ margin-top:36px; font-size:12.5px; color:var(--on-soft); font-variant-numeric:tabular-nums;
    letter-spacing:.03em; opacity:.85; }

  .talk{ margin-top:14px; }
  .talk a{ color:var(--on-soft); text-decoration:none; border-bottom:1px solid var(--line);
    font-size:12.5px; padding-bottom:1px; opacity:.85; }
  .talk a:hover{ color:var(--on-field); opacity:1; }
  .talk a:focus-visible{ outline:2px solid var(--halo); outline-offset:3px; }
</style>

<div class="stage">
  <div class="aura"><div class="ring"></div><div class="orb"></div></div>
  <div class="beat" id="beat">·</div>
  <p class="line" id="line">…</p>

  <div class="one">
    <span class="k">the one thing</span>
    <span class="act" id="act">…</span>
  </div>

  <div class="under"><p id="under">…</p></div>

  <div class="clock" id="clock">—</div>
  <div class="talk"><a href="#" id="talk">something's heavy — talk it out →</a></div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  // Beats: one gentle line + one small thing, chosen by the hour. Nothing to press.
  var BEATS = [
    { from:0,  to:5,  tod:'night', name:'late night',
      line:"It's late, Kay. Nothing needs fixing tonight.",
      act:"Dim the screens. Open a curtain a crack for the morning." },
    { from:5,  to:11, tod:'dawn',  name:'morning',
      line:"Good morning. Nothing's owed yet — just light.",
      act:"Open the curtains. Ten minutes of light in your eyes." },
    { from:11, to:14, tod:'day',   name:'one gentle move',
      line:"One move, gently. Not the pile — just the next thing.",
      act:"Open the lab paper and write one sentence." },
    { from:14, to:17, tod:'day',   name:'the door',
      line:"Before the “too late” story starts — the door still opens.",
      act:"Step outside for fifteen minutes of daylight." },
    { from:17, to:21, tod:'dusk',  name:'closing the day',
      line:"Let's close the day kindly.",
      act:"Name one win — however small — and let the rest go." },
    { from:21, to:24, tod:'night', name:'wind down',
      line:"The day is allowed to end now.",
      act:"Lights low, screens down. Curtains set for morning." }
  ];
  function beatFor(h){ for(var i=0;i<BEATS.length;i++){ if(h>=BEATS[i].from && h<BEATS[i].to) return BEATS[i]; } return BEATS[0]; }

  function render(){
    var now=new Date(), h=now.getHours(), b=beatFor(h);
    document.body.setAttribute('data-tod', b.tod);
    $('beat').textContent=b.name; $('line').textContent=b.line; $('act').textContent=b.act;
    var mm=now.getMinutes(); mm=mm<10?('0'+mm):mm;
    var ap=h<12?'am':'pm', h12=((h%12)||12);
    $('clock').textContent=h12+':'+mm+' '+ap;
  }

  // The undercurrent — soft, therapy-grounded lines that rotate on their own,
  // so the companion keeps giving to Kay without a single tap.
  var LINES = [
    "You don't have to earn rest. It's already yours.",
    "One thing at a time. The rest is held for you.",
    "A missed day is data, not a verdict — the next morning is always open.",
    "Late light beats no light. There's no hour the door won't open.",
    "Set the shame down. It isn't carrying you anywhere good.",
    "Act first; the feeling follows. You don't have to want to yet.",
    "The pile is only heavy when you hold it all at once. It's on paper now.",
    "Curtains open is the cheapest win there is. Start there.",
    "You over-extended — you didn't fail. Your body just needs the rhythm back.",
    "Small and done beats perfect and someday.",
    "Nothing is required of you right now. Just being here counts."
  ];
  var li = Math.floor(new Date().getSeconds()) % LINES.length;
  var under = $('under');
  function showLine(){ under.textContent = LINES[li]; }
  function rotate(){
    under.style.opacity = 0;
    setTimeout(function(){ li=(li+1)%LINES.length; showLine(); under.style.opacity=1; }, 1100);
  }
  showLine();

  $('talk').onclick=function(e){ e.preventDefault();
    under.style.opacity=0;
    setTimeout(function(){ under.textContent="Come back to the chat with your butler and just say what's heavy. It's holding the whole list — you only bring the feeling."; under.style.opacity=1; }, 500);
  };

  render();
  setInterval(render, 60000);   // keep the hour + field honest
  setInterval(rotate, 24000);   // the undercurrent breathes on its own
})();
</script>
